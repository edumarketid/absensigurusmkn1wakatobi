<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Guru</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div id="app" class="max-w-2xl mx-auto min-h-screen bg-white shadow-md p-4">
    <!-- Indikator Offline -->
    <div id="offline-banner" class="hidden bg-yellow-500 text-white text-xs text-center py-1 rounded mb-2">
      Modus Offline: Absensi disimpan lokal & disinkronkan saat online.
    </div>

    <!-- Tampilan Login -->
    <div id="view-login" class="space-y-4 pt-10 max-w-xs mx-auto">
      <h1 class="text-2xl font-bold text-center text-blue-600">Absensi Guru</h1>
      <input type="text" id="login-user" placeholder="Nomor HP / Username Admin" class="w-full border p-2 rounded text-sm">
      <input type="password" id="login-pin" placeholder="PIN" class="w-full border p-2 rounded text-sm">
      <button onclick="doLogin()" class="w-full bg-blue-600 text-white py-2 rounded font-semibold text-sm">Masuk</button>
    </div>

    <!-- Dashboard Guru -->
    <div id="view-guru" class="hidden space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <div>
          <h2 id="guru-nama" class="font-bold"></h2>
          <p id="guru-nip" class="text-xs text-gray-500"></p>
        </div>
        <button onclick="logout()" class="text-xs text-red-500">Keluar</button>
      </div>

      <!-- Form Absen -->
      <div class="border p-3 rounded space-y-2 bg-blue-50">
        <h3 class="font-semibold text-sm">Formulir Absensi</h3>
        <select id="absen-jenis" class="w-full border p-2 rounded bg-white text-sm">
          <option value="Pagi">Absen Pagi</option>
          <option value="Siang">Absen Siang</option>
        </select>
        <select id="absen-status" class="w-full border p-2 rounded bg-white text-sm">
          <option value="Hadir">Hadir</option>
          <option value="Izin">Izin</option>
          <option value="Sakit">Sakit</option>
          <option value="DL">Dinas Luar (DL)</option>
        </select>
        <div id="form-manual" class="space-y-2">
          <label class="inline-flex items-center text-xs">
            <input type="checkbox" id="absen-is-manual" class="mr-1"> Lupa Absen / Set Manual Jam
          </label>
          <input type="time" id="absen-jam-manual" class="w-full border p-2 rounded bg-white text-sm">
          <textarea id="absen-ket" placeholder="Keterangan (Wajib jika Izin/Sakit/DL/Manual)" class="w-full border p-2 rounded bg-white text-sm"></textarea>
        </div>
        <button onclick="kirimAbsen()" class="w-full bg-green-600 text-white py-2 rounded font-semibold text-sm">Kirim Absen</button>
      </div>

      <!-- Riwayat Pribadi -->
      <div>
        <h3 class="font-semibold text-sm mb-2">Riwayat Absensi</h3>
        <div id="riwayat-list" class="space-y-2 text-xs max-h-60 overflow-y-auto border p-2 rounded"></div>
      </div>
    </div>

    <!-- Dashboard Admin -->
    <div id="view-admin" class="hidden space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="font-bold">Panel Admin</h2>
        <button onclick="logout()" class="text-xs text-red-500">Keluar</button>
      </div>

      <!-- Navigasi Tab Admin -->
      <div class="flex border-b text-xs space-x-2">
        <button onclick="switchTab('laporan')" id="btn-tab-laporan" class="py-1 px-2 border-b-2 border-blue-600 font-semibold">Laporan</button>
        <button onclick="switchTab('guru')" id="btn-tab-guru" class="py-1 px-2">Data Guru</button>
        <button onclick="switchTab('waktu')" id="btn-tab-waktu" class="py-1 px-2">Waktu & Libur</button>
        <button onclick="switchTab('pengaturan')" id="btn-tab-pengaturan" class="py-1 px-2">Pengaturan Umum</button>
      </div>

      <!-- Tab Laporan -->
      <div id="tab-laporan" class="space-y-2 text-xs">
        <select id="lap-tipe" class="w-full border p-1 rounded">
          <option value="harian">Harian</option>
          <option value="mingguan">Mingguan</option>
          <option value="bulanan">Bulanan</option>
          <option value="semesteran">Semesteran</option>
          <option value="tahunan">Tahunan</option>
        </select>
        <input type="date" id="lap-tanggal" class="w-full border p-1 rounded">
        <input type="text" id="lap-periode-teks" placeholder="Teks Periode (mis: Minggu ke 4 September 2026)" class="w-full border p-1 rounded">
        <button onclick="generateLaporan()" class="w-full bg-blue-600 text-white py-1 rounded">Pratinjau / Cetak Laporan</button>
        <div id="area-laporan" class="border p-2 mt-2 bg-white overflow-x-auto hidden"></div>
      </div>

      <!-- Tab Data Guru -->
      <div id="tab-guru" class="hidden space-y-2 text-xs">
        <button onclick="tambahGuruModal()" class="bg-green-600 text-white px-2 py-1 rounded mb-2">+ Tambah Guru</button>
        <div id="list-guru-admin" class="space-y-1"></div>
      </div>

      <!-- Tab Waktu & Hari Libur -->
      <div id="tab-waktu" class="hidden space-y-4 text-xs">
        <!-- Pengaturan Waktu Per Hari -->
        <div class="border p-3 rounded bg-gray-50 space-y-2">
          <h3 class="font-bold text-sm text-blue-600">Pengaturan Jam Kerja (Senin–Sabtu)</h3>
          <p class="text-gray-500 text-xs">* Hari Minggu otomatis diatur sebagai Hari Libur.</p>
          <div id="container-jadwal-hari" class="space-y-2"></div>
          <button onclick="simpanJadwalWaktu()" class="w-full bg-blue-600 text-white py-1.5 rounded font-semibold mt-2">Simpan Jam Kerja</button>
        </div>

        <!-- Kelola Hari Libur -->
        <div class="border p-3 rounded bg-gray-50 space-y-2">
          <h3 class="font-bold text-sm text-red-600">Kelola Hari Libur Khusus / Nasional</h3>
          <div class="flex space-x-2">
            <input type="date" id="libur-tanggal" class="border p-1 rounded w-1/3">
            <input type="text" id="libur-ket" placeholder="Keterangan Libur (mis: Hari Raya)" class="border p-1 rounded w-2/3">
            <button onclick="tambahHariLibur()" class="bg-red-600 text-white px-3 py-1 rounded">Tambah</button>
          </div>
          <div id="list-hari-libur" class="space-y-1 mt-2"></div>
        </div>
      </div>

      <!-- Tab Pengaturan Umum -->
      <div id="tab-pengaturan" class="hidden space-y-2 text-xs">
        <input type="text" id="cfg-sekolah" placeholder="Nama Sekolah" class="w-full border p-1 rounded">
        <input type="text" id="cfg-ta" placeholder="Tahun Ajaran" class="w-full border p-1 rounded">
        <input type="text" id="cfg-kota" placeholder="Nama Kota" class="w-full border p-1 rounded">
        <input type="text" id="cfg-kepsek" placeholder="Nama Kepala Sekolah" class="w-full border p-1 rounded">
        <input type="text" id="cfg-nip-kepsek" placeholder="NIP Kepala Sekolah" class="w-full border p-1 rounded">
        <input type="text" id="cfg-kop" placeholder="URL Gambar KOP Sekolah" class="w-full border p-1 rounded">
        <button onclick="simpanPengaturanUmum()" class="w-full bg-blue-600 text-white py-1.5 rounded font-semibold">Simpan Pengaturan Umum</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "URL_APPS_SCRIPT_ANDA_DI_SINI";
    let currentUser = JSON.parse(localStorage.getItem("user")) || null;
    let adminData = null;

    const HARI_LIST = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    function updateStatus() {
      document.getElementById("offline-banner").classList.toggle("hidden", navigator.onLine);
      if (navigator.onLine) syncOfflineData();
    }

    function init() {
      updateStatus();
      if (currentUser) {
        if (currentUser.role === "guru") showGuruDashboard();
        else if (currentUser.role === "admin") showAdminDashboard();
      }
    }

    async function doLogin() {
      const u = document.getElementById("login-user").value;
      const p = document.getElementById("login-pin").value;
      if (!navigator.onLine) { alert("Login awal memerlukan koneksi internet."); return; }

      const res = await fetch(`${GAS_URL}?action=login&data=${encodeURIComponent(JSON.stringify({username: u, pin: p}))}`).then(r => r.json());
      if (res.success) {
        currentUser = res;
        localStorage.setItem("user", JSON.stringify(res));
        init();
      } else { alert(res.message); }
    }

    function logout() {
      localStorage.removeItem("user");
      currentUser = null;
      location.reload();
    }

    function showGuruDashboard() {
      document.getElementById("view-login").classList.add("hidden");
      document.getElementById("view-guru").classList.remove("hidden");
      document.getElementById("guru-nama").innerText = currentUser.guru.nama;
      document.getElementById("guru-nip").innerText = "NIP: " + currentUser.guru.nip;
      loadRiwayat();
    }

    async function showAdminDashboard() {
      document.getElementById("view-login").classList.add("hidden");
      document.getElementById("view-admin").classList.remove("hidden");
      loadAdminData();
    }

    async function loadAdminData() {
      if (!navigator.onLine) return;
      const res = await fetch(`${GAS_URL}?action=getAdminData`).then(r => r.json());
      if (res.success) {
        adminData = res;
        renderJadwalWaktu();
        renderHariLibur();
        renderPengaturanUmum();
        renderListGuru();
      }
    }

    function renderJadwalWaktu() {
      const container = document.getElementById("container-jadwal-hari");
      const cfg = adminData.config || {};
      container.innerHTML = HARI_LIST.map(h => {
        const keyPrefix = h.toLowerCase();
        return `
          <div class="p-2 border rounded bg-white">
            <span class="font-bold text-gray-700 mb-1 block">${h}</span>
            <div class="grid grid-cols-2 gap-1">
              <div><label class="text-[10px] text-gray-500">Mulai Pagi</label><input type="time" id="${keyPrefix}_mulai_pagi" value="${cfg[keyPrefix + '_mulai_pagi'] || '06:30'}" class="w-full border p-1 rounded"></div>
              <div><label class="text-[10px] text-gray-500">Toleransi Pagi</label><input type="time" id="${keyPrefix}_tol_pagi" value="${cfg[keyPrefix + '_tol_pagi'] || '07:15'}" class="w-full border p-1 rounded"></div>
              <div><label class="text-[10px] text-gray-500">Mulai Siang</label><input type="time" id="${keyPrefix}_mulai_siang" value="${cfg[keyPrefix + '_mulai_siang'] || '12:00'}" class="w-full border p-1 rounded"></div>
              <div><label class="text-[10px] text-gray-500">Batas Siang</label><input type="time" id="${keyPrefix}_batas_siang" value="${cfg[keyPrefix + '_batas_siang'] || '14:00'}" class="w-full border p-1 rounded"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function simpanJadwalWaktu() {
      const config = adminData.config || {};
      HARI_LIST.forEach(h => {
        const k = h.toLowerCase();
        config[k + '_mulai_pagi'] = document.getElementById(`${k}_mulai_pagi`).value;
        config[k + '_tol_pagi'] = document.getElementById(`${k}_tol_pagi`).value;
        config[k + '_mulai_siang'] = document.getElementById(`${k}_mulai_siang`).value;
        config[k + '_batas_siang'] = document.getElementById(`${k}_batas_siang`).value;
      });
      const res = await fetch(`${GAS_URL}?action=savePengaturan&data=${encodeURIComponent(JSON.stringify(config))}`).then(r => r.json());
      alert(res.message);
      loadAdminData();
    }

    function renderHariLibur() {
      const container = document.getElementById("list-hari-libur");
      const list = adminData.hariLibur || [];
      container.innerHTML = list.map(l => `
        <div class="flex justify-between items-center border-b pb-1">
          <span><b>${l.tanggal}</b>: ${l.keterangan}</span>
          <button onclick="hapusHariLibur('${l.id_libur}')" class="text-red-500 text-xs">Hapus</button>
        </div>
      `).join('');
    }

    async function tambahHariLibur() {
      const tgl = document.getElementById("libur-tanggal").value;
      const ket = document.getElementById("libur-ket").value;
      if (!tgl || !ket) { alert("Tanggal dan keterangan libur wajib diisi!"); return; }
      const res = await fetch(`${GAS_URL}?action=addHariLibur&data=${encodeURIComponent(JSON.stringify({tanggal: tgl, keterangan: ket}))}`).then(r => r.json());
      alert(res.message);
      loadAdminData();
    }

    async function hapusHariLibur(id) {
      if (!confirm("Yakin hapus tanggal libur ini?")) return;
      const res = await fetch(`${GAS_URL}?action=deleteHariLibur&data=${encodeURIComponent(JSON.stringify({id_libur: id}))}`).then(r => r.json());
      alert(res.message);
      loadAdminData();
    }

    function renderPengaturanUmum() {
      const cfg = adminData.config || {};
      document.getElementById("cfg-sekolah").value = cfg.nama_sekolah || '';
      document.getElementById("cfg-ta").value = cfg.tahun_ajaran || '';
      document.getElementById("cfg-kota").value = cfg.kota || '';
      document.getElementById("cfg-kepsek").value = cfg.nama_kepsek || '';
      document.getElementById("cfg-nip-kepsek").value = cfg.nip_kepsek || '';
      document.getElementById("cfg-kop").value = cfg.kop_url || '';
    }

    async function simpanPengaturanUmum() {
      const config = adminData.config || {};
      config.nama_sekolah = document.getElementById("cfg-sekolah").value;
      config.tahun_ajaran = document.getElementById("cfg-ta").value;
      config.kota = document.getElementById("cfg-kota").value;
      config.nama_kepsek = document.getElementById("cfg-kepsek").value;
      config.nip_kepsek = document.getElementById("cfg-nip-kepsek").value;
      config.kop_url = document.getElementById("cfg-kop").value;

      const res = await fetch(`${GAS_URL}?action=savePengaturan&data=${encodeURIComponent(JSON.stringify(config))}`).then(r => r.json());
      alert(res.message);
      loadAdminData();
    }

    function renderListGuru() {
      const container = document.getElementById("list-guru-admin");
      container.innerHTML = (adminData.guru || []).map(g => `
        <div class="flex justify-between items-center border p-2 rounded">
          <div>
            <b>${g.nama}</b> (${g.nip})<br>
            <span class="text-gray-500">HP: ${g.hp} | Jabatan: ${g.jabatan}</span>
          </div>
          <button onclick="hapusGuru('${g.id_guru}')" class="text-red-500">Hapus</button>
        </div>
      `).join('');
    }

    async function hapusGuru(id) {
      if (!confirm("Yakin hapus guru ini?")) return;
      const res = await fetch(`${GAS_URL}?action=deleteGuru&data=${encodeURIComponent(JSON.stringify({id_guru: id}))}`).then(r => r.json());
      alert(res.message);
      loadAdminData();
    }

    function switchTab(tab) {
      ["laporan", "guru", "waktu", "pengaturan"].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add("hidden");
        document.getElementById(`btn-tab-${t}`).classList.remove("border-b-2", "border-blue-600", "font-semibold");
      });
      document.getElementById(`tab-${tab}`).classList.remove("hidden");
      document.getElementById(`btn-tab-${tab}`).classList.add("border-b-2", "border-blue-600", "font-semibold");
    }

    async function kirimAbsen() {
      const jenis = document.getElementById("absen-jenis").value;
      const status = document.getElementById("absen-status").value;
      const isManual = document.getElementById("absen-is-manual").checked;
      const jamManual = document.getElementById("absen-jam-manual").value;
      const ket = document.getElementById("absen-ket").value;

      if ((status !== "Hadir" || isManual) && !ket) {
        alert("Keterangan wajib diisi untuk absensi ini!");
        return;
      }

      const now = new Date();
      const tanggalStr = now.toISOString().split('T')[0];
      const jamStr = isManual && jamManual ? jamManual : now.toTimeString().split(' ')[0].substring(0, 5);

      navigator.geolocation.getCurrentPosition(async (pos) => {
        const coords = `${pos.coords.latitude},${pos.coords.longitude}`;
        const record = {
          id_absen: "ABS-" + Date.now(),
          id_guru: currentUser.guru.id_guru,
          tanggal: tanggalStr,
          jam: jamStr,
          jenis_absen: jenis,
          status: status,
          keterangan: ket,
          koordinat: coords,
          is_manual: isManual
        };

        if (navigator.onLine) {
          await fetch(`${GAS_URL}?action=syncAbsen&data=${encodeURIComponent(JSON.stringify([record]))}`);
          alert("Absensi berhasil terkirim!");
        } else {
          let pending = JSON.parse(localStorage.getItem("pending_absen") || "[]");
          pending.push(record);
          localStorage.setItem("pending_absen", JSON.stringify(pending));
          alert("Tersimpan lokal (Offline). Akan otomatis disinkronkan saat online.");
        }
        loadRiwayat();
      }, () => {
        alert("Gagal mendapatkan lokasi. Pastikan GPS aktif.");
      });
    }

    async function syncOfflineData() {
      let pending = JSON.parse(localStorage.getItem("pending_absen") || "[]");
      if (pending.length > 0) {
        const res = await fetch(`${GAS_URL}?action=syncAbsen&data=${encodeURIComponent(JSON.stringify(pending))}`).then(r => r.json());
        if (res.success) {
          localStorage.removeItem("pending_absen");
          alert("Data absensi offline berhasil disinkronkan!");
        }
      }
    }

    async function loadRiwayat() {
      if (!navigator.onLine) return;
      const res = await fetch(`${GAS_URL}?action=getRiwayatGuru&data=${encodeURIComponent(JSON.stringify({id_guru: currentUser.guru.id_guru}))}`).then(r => r.json());
      if (res.success) {
        const container = document.getElementById("riwayat-list");
        container.innerHTML = res.data.map(r => `
          <div class="border-b pb-1">
            <div class="flex justify-between font-bold">
              <span>${r.tanggal} (${r.jam})</span>
              <span class="text-blue-600">${r.status}</span>
            </div>
            <div class="text-gray-500">${r.jenis} ${r.is_manual === 'YA' ? '[Manual]' : ''} - ${r.keterangan || '-'}</div>
          </div>
        `).join('');
      }
    }

    async function generateLaporan() {
      const tipe = document.getElementById("lap-tipe").value;
      const tanggal = document.getElementById("lap-tanggal").value;
      const periodeTeks = document.getElementById("lap-periode-teks").value;

      const res = await fetch(`${GAS_URL}?action=getLaporan&data=${encodeURIComponent(JSON.stringify({tipe, tanggal}))}`).then(r => r.json());
      if (res.success) {
        const area = document.getElementById("area-laporan");
        area.classList.remove("hidden");
        const cfg = res.config;

        let tableHtml = "";
        if (res.tipe === "harian") {
          tableHtml = `
            <div class="text-center mb-4">
              ${cfg.kop_url ? `<img src="${cfg.kop_url}" class="h-16 mx-auto mb-2">` : ''}
              <h2 class="font-bold text-sm">Daftar Hadir Guru ${cfg.nama_sekolah || ''}</h2>
              <p class="text-xs">Periode: ${tanggal}</p>
              <p class="text-xs">Tahun Ajaran ${cfg.tahun_ajaran || ''}</p>
            </div>
            <table class="w-full border-collapse border border-gray-300 text-[10px]">
              <thead>
                <tr class="bg-gray-100">
                  <th class="border p-1">No.</th>
                  <th class="border p-1">Nama Lengkap</th>
                  <th class="border p-1">NIP</th>
                  <th class="border p-1">Jabatan</th>
                  <th class="border p-1">Keterangan</th>
                </tr>
              </thead>
              <tbody>
                ${res.data.map((d, i) => `
                  <tr>
                    <td class="border p-1 text-center">${i + 1}</td>
                    <td class="border p-1">${d.nama}</td>
                    <td class="border p-1">${d.nip}</td>
                    <td class="border p-1">${d.jabatan}</td>
                    <td class="border p-1">${d.keterangan}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        } else {
          tableHtml = `
            <div class="text-center mb-4">
              ${cfg.kop_url ? `<img src="${cfg.kop_url}" class="h-16 mx-auto mb-2">` : ''}
              <h2 class="font-bold text-sm">Daftar Hadir Guru ${cfg.nama_sekolah || ''}</h2>
              <p class="text-xs">Periode: ${periodeTeks || 'Ganjil/Genap'}</p>
              <p class="text-xs">Tahun Ajaran ${cfg.tahun_ajaran || ''}</p>
            </div>
            <table class="w-full border-collapse border border-gray-300 text-[10px]">
              <thead>
                <tr class="bg-gray-100">
                  <th class="border p-1">No.</th>
                  <th class="border p-1">Nama Lengkap</th>
                  <th class="border p-1">NIP</th>
                  <th class="border p-1">Jabatan</th>
                  <th class="border p-1">Hadir</th>
                  <th class="border p-1">Alpa</th>
                  <th class="border p-1">Izin</th>
                  <th class="border p-1">Sakit</th>
                  <th class="border p-1">DL</th>
                  <th class="border p-1">Terlambat</th>
                  <th class="border p-1">Persentase (%)</th>
                </tr>
              </thead>
              <tbody>
                ${res.data.map((d, i) => `
                  <tr>
                    <td class="border p-1 text-center">${i + 1}</td>
                    <td class="border p-1">${d.nama}</td>
                    <td class="border p-1">${d.nip}</td>
                    <td class="border p-1">${d.jabatan}</td>
                    <td class="border p-1 text-center">${d.rekap.hadir}</td>
                    <td class="border p-1 text-center">${d.rekap.alpa}</td>
                    <td class="border p-1 text-center">${d.rekap.izin}</td>
                    <td class="border p-1 text-center">${d.rekap.sakit}</td>
                    <td class="border p-1 text-center">${d.rekap.dl}</td>
                    <td class="border p-1 text-center">${d.rekap.terlambat}</td>
                    <td class="border p-1 text-center">${d.persentase}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        }

        tableHtml += `
          <div class="mt-6 flex justify-end text-xs">
            <div class="text-center">
              <p>${cfg.kota || 'Kota'}, ${new Date().toLocaleDateString('id-ID')}</p>
              <p>Kepala Sekolah</p>
              <br><br><br>
              <p class="font-bold underline">${cfg.nama_kepsek || '...................'}</p>
              <p>NIP. ${cfg.nip_kepsek || '...................'}</p>
            </div>
          </div>
        `;

        area.innerHTML = tableHtml;
      }
    }

    init();
  </script>
</body>
</html>
